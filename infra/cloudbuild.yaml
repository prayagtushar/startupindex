# Build the API image from the repo root, since the Dockerfile expects that context.
# BuildKit is required: apps/api/Dockerfile uses RUN --mount=type=cache.
steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - ${_IMAGE}
options:
  # Default machine only. E2_HIGHCPU_8 builds ~2x faster but is not covered by
  # the 120 free build-minutes/day, so each build would cost ~$0.30.
  logging: CLOUD_LOGGING_ONLY
timeout: 2700s
